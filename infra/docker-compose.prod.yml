# Dung tren VPS that (Phase 2). Khac docker-compose.yml (dev) o cho:
#   - Keo image co san tu ghcr.io (CI da build o Bai 5) thay vi build tai cho tren VPS yeu.
#   - Chi expose port 80 (qua service "proxy"), khong lo cong DynamoDB/MinIO/backend ra internet.
#   - DynamoDB luu file that (-dbPath) vi day la du lieu that can giu lai qua cac lan restart.
#   - MinIO doi mat khau qua bien MINIO_ROOT_PASSWORD (khong dung mac dinh "minioadmin" tren server cong khai).
services:
  dynamodb-local:
    image: amazon/dynamodb-local:2.5.2
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    volumes:
      - dynamodb-data:/data
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Hay dat MINIO_ROOT_PASSWORD trong file .env}
    volumes:
      - minio-data:/data
    restart: unless-stopped

  init:
    image: ghcr.io/0389382617/pinslocal/backend:latest
    command: ["node", "src/scripts/setup.js"]
    environment: &backend-env
      AWS_REGION: us-east-1
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      DYNAMODB_TABLE: Pins
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL_BASE: /photos
      S3_BUCKET: pinslocal-photos
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Hay dat MINIO_ROOT_PASSWORD trong file .env}
    depends_on:
      - dynamodb-local
      - minio
    restart: "no"

  backend:
    image: ghcr.io/0389382617/pinslocal/backend:latest
    environment:
      <<: *backend-env
      PORT: "4000"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    image: ghcr.io/0389382617/pinslocal/frontend:latest
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  dynamodb-data:
  minio-data:
