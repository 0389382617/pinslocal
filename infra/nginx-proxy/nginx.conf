# Reverse proxy dung tren VPS that (Phase 2): gop frontend + backend + anh (MinIO)
# vao chung 1 origin (port 80), de:
#   - frontend goi API qua duong dan tuong doi /api/... (khong can biet IP/domain that)
#   - anh hien qua /photos/... (khong expose MinIO ra internet)
#   - sau nay gan domain + SSL chi can cau hinh 1 cho duy nhat (server nay)
server {
    listen 80;
    server_name _;

    # Khop voi gioi han upload anh 5MB cua backend (multer). Mac dinh Nginx la 1MB,
    # thap hon anh chup dien thoai thong thuong -> se chan nham upload hop le neu bo qua.
    client_max_body_size 6m;

    # Chan /metrics (Prometheus) truoc khi roi vao location /api/ chung - production
    # khong dung Prometheus scrape qua proxy nay nen khong can lo endpoint noi bo nay
    # ra internet cong khai.
    location = /api/metrics {
        deny all;
        return 404;
    }

    location /api/ {
        proxy_pass http://backend:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /photos/ {
        proxy_pass http://minio:9000/;
    }

    location / {
        proxy_pass http://frontend:80/;
    }
}
