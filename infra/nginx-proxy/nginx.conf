# Reverse proxy dung tren VPS that (Phase 2): gop frontend + backend + anh (MinIO)
# vao chung 1 origin (port 80), de:
#   - frontend goi API qua duong dan tuong doi /api/... (khong can biet IP/domain that)
#   - anh hien qua /photos/... (khong expose MinIO ra internet)
#   - sau nay gan domain + SSL chi can cau hinh 1 cho duy nhat (server nay)
server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://backend:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /photos/ {
        proxy_pass http://minio:9000/;
    }

    location / {
        proxy_pass http://frontend:80/;
    }
}
