services:
  dynamodb-local:
    image: amazon/dynamodb-local:2.5.2
    # -inMemory: du lieu mat khi container restart, chap nhan duoc cho MVP local
    # (tranh loi quyen ghi file SQLite khi mount volume tren Docker Desktop/Windows).
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      - "8000:8000"

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # Giao dien web de xem du lieu DynamoDB bang mat (chi dung khi phat trien local,
  # KHONG dua vao docker-compose.prod.yml vi khong co dang nhap/bao mat).
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    environment:
      DYNAMO_ENDPOINT: http://dynamodb-local:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    ports:
      - "8001:8001"
    depends_on:
      - dynamodb-local

  init:
    build: ../backend
    command: ["node", "src/scripts/setup.js"]
    environment: &backend-env
      AWS_REGION: us-east-1
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      DYNAMODB_TABLE: Pins
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL_BASE: http://localhost:9000
      S3_BUCKET: pinslocal-photos
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    depends_on:
      dynamodb-local:
        condition: service_started
      minio:
        condition: service_started

  backend:
    build: ../backend
    environment:
      <<: *backend-env
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: http://localhost:4000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  minio-data:
